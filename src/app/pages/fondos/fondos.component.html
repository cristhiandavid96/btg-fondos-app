<h2>{{textos.get('availableFundsList')}}</h2>

<div class="saldo">💰 {{textos.get('currentBalance')}} {{ saldo$ | async | currency:'COP' }}</div>

<div *ngIf="errorMsg" class="alerta">{{ errorMsg }}</div>

<div class="fondos-grid">
  <app-fondo-card
    *ngFor="let fondo of fondos$ | async"
    [fondo]="fondo"
    (suscribirse)="onSuscribirse($event)"
    (cancelar)="onCancelar($event)"
  ></app-fondo-card>
</div>


<ng-template #loading>
  {{textos.get('loadingFunds')}}
</ng-template>
